# CircleCI pipeline for 906digital.com
#
# The site is a single hand-edited index.html with no build step, so this
# pipeline only checks — it does not build or deploy. Deployment stays manual
# (Cloudflare Pages direct upload), as described in README.md.
#
# Config reference: https://circleci.com/docs/reference/configuration-reference/
version: 2.1

jobs:
  check:
    docker:
      - image: cimg/node:20.18
    steps:
      - checkout

      # html-validate is pinned to an exact version on purpose: a new rule in a
      # future release should not turn this build red without a deliberate bump.
      # Stylistic rules are switched off in .htmlvalidate.json.
      - run:
          name: Validate HTML
          command: npx --yes html-validate@8.29.0 index.html advisory.html

      # Anchor targets resolve; retired launch placeholders stay retired.
      - run:
          name: Check anchors and placeholders
          command: node scripts/check-content.mjs

workflows:
  check-site:
    jobs:
      - check
